name: CI

# Runs on the GitHub mirror (see mirror-back.yml for the mirroring topology).
# GitLab remains the canonical host; this is the only place the suite runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build from environment.yml rather than a hand-maintained dependency
      # list, so CI cannot drift from the documented dev setup. That file pins
      # python=3.13 (bpy==5.1.2 ships cp313 wheels only) and caps numpy<2.3
      # (2.4.x faults matplotlib's compiled Agg path) -- constraints a
      # separate pip list would silently lose.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Lint (bug-level rules — blocking)
        shell: micromamba-shell {0}
        run: ruff check --select F82,F63,F7,E9 src/growpy

      - name: Lint (full rule set — advisory)
        shell: micromamba-shell {0}
        run: ruff check src/growpy
        continue-on-error: true

      # The Grove is commercial and gitignored, so `the_grove_23_core` is absent
      # here. The modules that need it guard the import and skip; everything
      # else runs. pytest.ini already puts src/ on the path.
      - name: Test
        shell: micromamba-shell {0}
        run: pytest -q
