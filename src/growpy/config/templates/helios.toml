# GrowPy Helios++ LiDAR Export Settings
#
# Controls OBJ/MTL export for Helios++ point cloud simulation
# and material-aware mesh simplification.

[helios]
# Export OBJ/MTL files for Helios++ LiDAR simulation
# Converts USDA assemblies to Wavefront OBJ with baked twig instances
export_obj = false
# Generate Helios++ scene XML placing all tree OBJs at CSV positions
individual_obj = false
helios_scene = false
# Also export individual per-tree OBJ files (default: false, only combined OBJ)
# OBJ coordinate up axis: "y" (standard OBJ/Blender) or "z" (matches USD/Helios)
obj_up_axis = "y"

# Per-tree Helios++ classification codes for labeled point clouds.
# Two-digit code [material][fid]: material 1=leaf, 2=wood; fid 1-9 from CSV.
# fid 0 is reserved for the ground plane. Requires "selected_*" species
# variants (see SPECIES_CODES in growpy.io.helios.classification) and at
# least leaf + wood materials per species.
# Trees with fid > 9 fall back to class 4 (see run warnings).
classification = false

# Material-aware mesh simplification applied in-memory before OBJ write.
# Reduces file size and Helios++ processing time without re-reading/re-writing files.
# Material classification: "bark" = trunk/branch, "wood" = twig wood sub-materials,
# "leaf" = leaf/foliage (preserve for LAI). Uses WOOD_KEYWORDS for detection.
[helios.simplification]
enabled = false
# Bark/trunk simplification ratio (0.0-1.0, 0.2 = keep 20% of faces)
bark = 0.2
# Twig wood simplification ratio (0.0-1.0)
wood = 0.2
# Leaf simplification ratio - global default (1.0 = keep all, critical for LAI accuracy)
# Override per species in [helios.simplification.per_species.<species>] below.
leaf = 0.5
# Fruit simplification ratio (0.0-1.0, e.g. EuropeanOakFruits)
fruit = 0.2

# Per-species overrides for any subset of bark/wood/leaf/fruit. Keys are
# species_clean names (lowercase, underscores). Omitted keys, and species
# not listed here, fall back to the global values above.
[helios.simplification.per_species]
# [helios.simplification.per_species.selected_european_beech]
# leaf = 0.2
# [helios.simplification.per_species.selected_european_oak]
# bark = 0.1
# wood = 0.05
# leaf = 0.25
# [helios.simplification.per_species.selected_scots_pine]
# leaf = 0.3
