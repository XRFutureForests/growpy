# GrowPy Surround

# Grove's built-in Surround feature shades a tree against a statistical shell of
# virtual neighbours instead of simulating real neighbour trees. This gives the
# tall, slender, self-pruned form of a forest-grown tree at a fraction of the
# cost of the multi-tree competition clusters it replaces.
#
# Each tree's competition level is a plain number: its surround_radius column
# value (in the dataset planner CSVs, or a real forest CSV) selects the shell
# distance directly. 0 = no surround (open-grown). >0 = shell distance in
# meters, and must be one of the values listed in `radii` below so a matching
# calibrated growth model exists (see growth_models.toml / create-models step).
# Grove disables Surround when several trees are simulated together in one
# grove, so this only affects single-tree contexts.

[surround]
radii = [0.0, 8.0, 16.0]  # 0 = no surround; >0 = shell distance (meters)
# NOTE: 16 m is beyond the 4-10 m range docs/reference/grove-preset-reference.md
# documents for surround_distance. Grove accepts it, but the shell is far enough
# away that its effect is weak -- the earlier r18 variant came out nearly
# indistinguishable from r00. Kept because a wide, weakly-competed variant is
# wanted in the matrix; do not read it as a strongly-shaded case.
density = 0.45            # surrounding tree density (0..1), shared by all radii
# History, because the value has moved twice for different reasons. It was
# briefly lowered to 0.5 because 0.75 looked lethal -- norway_spruce collapsing
# 18.1 -> 4.5 m at r08 and european_oak reduced to a bare whip. Both were
# actually caused by `grow = true` below, not by density, so 0.75 was restored
# 2026-08-24 once the shell was fixed: all 11 species hold 25 m at 0.75 with no
# preset patches at all.
#
# Lowered again to 0.45 on 2026-08-25, for the reason recorded at
# [surround.grow_per_species] below: 0.40-0.50 is european_oak's realistic band,
# and above ~0.6 it becomes a whip.
#
# A single global is a poor fit for the whole set, which is what
# [surround.density_per_species] below exists for. Do not tune this number for
# one species -- measure with `growpy-crown-metrics` and override that species
# instead.
#
# Shell height, and whether the shell tracks the tree's own height.
#
# These two were 0.5 / true and that combination is what caused every
# "structural collapse" chased through 2026-08-22..24. With grow = true the
# neighbour shell rises with the tree FOREVER: no matter how tall it gets, it is
# still shaded exactly as much as when it was a sapling. No tree can ever become
# dominant, so under sustained shade it eventually loses structure outright.
#
# A/B on norway_spruce at r08, same seed (512), same density, same calibration,
# nothing differing but these two keys (data/tmp/run25m/export_mutation_test.py):
#
#     height 0.5, grow = true   ->  reached 15 m, peak 19.91 -> final 1.07 m
#                                   (109-cycle stall: collapse)
#     height 6.5, grow = false  ->  reached 25.0 m, held 25.10, zero stalls
#
# 6.5 / false is what every Grove preset ships. The preset author's model is a
# stand of fixed-height neighbours that a dominant tree overtops -- which is
# also what happens in a real stand, and it produces the classic forest form:
# early suppression self-prunes the lower stem, then the crown develops free
# above the neighbours. That is the silhouette we want and could not get by
# tuning drop rates.
#
# Everything built on top of the old values is therefore suspect. The
# drop_decay/drop_weak ramps in config/preset_patches.json existed only to keep
# trees alive under a shell they could never escape, and they did it by
# suppressing self-pruning -- which is what produced the opaque, bole-less
# crowns in the 2026-08-23 dataset. Re-screen before trusting any of them.
height = 6.5              # shell height (meters), shared by all radii
grow = false              # DEFAULT (conifers); broadleaves override below

# Per-species override of `grow`. Conifers and broadleaves respond so
# differently to a growing shell that one value cannot serve both. Measured
# 2026-08-25 at r08, crown width as a fraction of that species' own open-grown
# r00 crown (data/tmp/run25m/export_mutation_test.py, confirmed against the
# rendered icons):
#
#   european_oak, grow = true   d0.40 -> 0.52   d0.50 -> 0.64   realistic
#   norway_spruce, grow = true  d0.20 -> 0.39 ... d0.75 -> 0.22, bottlebrush at
#                               EVERY density -- foliage hugging the stem with
#                               no conical taper, never a narrow forest crown
#
# A conifer's monopodial architecture (add_only_on_end = 1.0, whorled laterals)
# collapses laterally under sustained shade rather than narrowing, so it needs
# the static shell. Broadleaves rebuild laterally and narrow properly.
#
# density is 0.45: oak's realistic band is 0.40-0.50, and above ~0.6 it becomes
# a whip with the crown confined to the top quarter.
[surround.grow_per_species]
common_ash = true
european_beech = true
european_oak = true
silver_birch = true
small_leaved_linden = true
sycamore_maple = true
wild_cherry = true
# conifers omitted deliberately -- they fall through to `grow = false` above:
# douglas_fir, norway_spruce, scots_pine, silver_fir

# Per-species override of `density`. Empty: every species uses the 0.45 global
# above. Read by GrowPyConfig.get_surround_density().
#
# Add a species here when its measured crown width misses the published
# crown-diameter/height ratio for that species (spruce 0.22, beech 0.30).
# Measure first -- `growpy-crown-metrics data/output/forest --stage h25m` reports
# crown diameter, crown base and crown ratio per species per radius straight off
# the exported assemblies. As of the 2026-08-28 run, with grow_per_species
# applied, no species needs an override: beech comes in at 29.8 m open-grown and
# 8.9 m at r08, i.e. the shell is biting.
[surround.density_per_species]

