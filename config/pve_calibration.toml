# PVE foliage calibration -- the shipped 15-tree set
# =================================================
#
# Every density here was bought with an Export click in the live editor. Losing
# this file means re-earning it by hand, which is why it is tracked rather than
# living in data/tmp/ (XRFF-441; it was scratch until 2026-09-14).
#
# It records what the PVE Growth Data JSON route needs and cannot derive from a
# growth JSON: how dense the foliage distributor must run to hit each tree's
# Forrester leaf-area target, and the settings that density was solved under.
# Change any of those settings and every density below is wrong.
#
# THREE TRAPS THIS SCHEMA EXISTS TO SURVIVE
# -----------------------------------------
#
# 1. `solved_density` IS NOT A BUILD DENSITY. It is the solver's recommendation,
#    and it is not guaranteed to have been computed against the growth JSON the
#    `history` was measured on -- for the fir h05 trees it was computed at a
#    different decimation fraction. Near the distributor's `max(loops, 1)` floor
#    the instance response is a staircase, so building with a stale
#    recommendation landed +47 % out. Build from `build_density`, or from the
#    last measured `history` pair, never from `solved_density`.
#
# 2. A `history` IS ONLY VALID AT THE `relative_start` IT WAS MEASURED UNDER.
#    A non-zero `relative_start` keeps the branch-root sample that 0.0 discards,
#    so it adds exactly one instance per branch. Beech runs at 0.4 but its
#    history was measured at 0.0, which is why every beech tree carries an
#    explicit `build_density` re-solved for 0.4. The loader refuses to fall back
#    to a history measured under a different value.
#
# 3. THE TWO SPECIES ENCODE THE DECIMATION FRACTION DIFFERENTLY IN FILENAMES --
#    beech `_f006`, fir `_f060`, both meaning 0.06. Never reconstruct a filename
#    from `fraction`. Each tree names its growth JSON explicitly, because a glob
#    on the tree id alone matches four files for fir r05_h05m.
#
# WHAT WAS SHIPPED
# ----------------
# 15 trees (9 European beech, 6 silver fir) exported 2026-09-11, carrying
# 815.4 m2 of true leaf area against the 816.9 m2 of Forrester target recorded
# below: -0.2 % aggregate.
#
# THE AGGREGATE HIDES THREE BAD TREES. Twelve of the fifteen land between
# -2.1 % and +3.1 %. The three fir h05 trees do not: they ship at -13.5 %
# (r05), -32.5 % (r10) and -32.5 % (r20), and two large fir trees over by
# +2.4 % and +3.1 % roughly cancel them in the total. They sit near the
# distributor's one-sample-per-branch floor, where a branch whose loop count is
# 1 contributes nothing at relative_start 0.0 and the response to density is a
# staircase rather than a slope -- 613 branches yielding 281 instances. Fixing
# them means a coarser decimation fraction, which means regrowing the trees.
# Read per-tree accuracy off `build_instances` against `target_instances`,
# never off the aggregate.

[pve_calibration]
schema_version = 1

# HALF A CONTRACT EACH. `profile_mean` is the mean radial multiplier of the PVE
# trunk profile; growpy divides emitted radii by it so a tape-measured DBH
# survives. `profile_pin` is which pin of PVPlantProfileLoader the graph must
# wire into MeshBuilder.Profile. Nothing in the engine checks the two agree --
# a graph on plantProfile_7 (0.7694) against a config saying 0.8215 produced
# trunks 6.3 % thin that still looked entirely plausible. Change one, change the
# other. Must match [unreal.growth_data_json].profile_mean in unreal.toml.
profile_mean = 0.8215
profile_pin = "plantProfile_8"


# ---------------------------------------------------------------- beech ----

[pve_calibration.species.european_beech]
# Foliage on the outer 60 % of every branch. This lifts the lowest foliage on
# r20_h15m from 0.14 m to 1.60 m and keeps leaves off the thick inner span of
# primary limbs. It is NOT count-neutral against 0.0, so every build_density
# below was re-solved for it (2026-09-11).
relative_start = 0.4
fraction = 0.06
phyllotaxy_formation = "OCTASTICHOUS"
# Leaf area of one twig prototype at instance scale 1.0, m2. The shipped graphs
# use a flat scale ramp at 1.0, so this is the area each placed instance carries.
prototype_leaf_area_m2 = 0.01583458005362597
# Mean triangles per placed instance, for bin-packing Export clicks on predicted
# geometry rather than on chain count. A fir instance is 1.7x a beech one.
palette_flat_mean_triangles = 13456.4
# The history below was measured at this relative_start, NOT at the species'.
history_relative_start = 0.0

# Fitted instances law, used only to seed a solve:
#   instances ~ slope_per_s * s_ratio + floor_per_branch * branches
# Fitted on the r05_h15m anchor at densities 83 and 166. The -1.039 intercept is
# the branch-root skip at relative_start = 0.0, not the max(loops, 1) floor.
[pve_calibration.species.european_beech.law]
slope_per_s = 0.9482564501593719
floor_per_branch = -1.0391908975979773
fitted_on = "r05_h15m densities 83, 166"

[pve_calibration.species.european_beech.anchor]
tree = "r05_h15m"
densities = [40, 83, 166]
instances = [730, 2140, 5102]

[pve_calibration.species.european_beech.trees.r05_h05m]
