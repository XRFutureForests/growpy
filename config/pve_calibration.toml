# ------------------------------------------------------------------ fir ----

[pve_calibration.species.silver_fir]
# Fir stays at 0.0. Four of six trees already have more branches than their
# Forrester target allows, so the one-instance-per-branch floor that a non-zero
# relative_start imposes would put them over target at density 1. Adopting it
# needs a coarser decimation fraction, which means regrowing the trees -- and a
# step-4 re-run grows a different tree.
relative_start = 0.0
fraction = 0.06
# Pectinate: two flat ranks per branch (XRFF-438, 2026-09-14).
phyllotaxy_formation = "DISTICHOUS"
prototype_leaf_area_m2 = 0.020138421345048785
prototype_area_per_triangle_m2 = 8.645928697717079e-07
palette_flat_mean_triangles = 23292.375
# The fir bark texture needs its V repeat halved or the bark tiles at the wrong
# aspect. Beech needs no correction, so it carries no bark_y_scale at all.
bark_y_scale = 0.5
forrester_model_id = "forrester2017_conifers_la"
# Measured at 0.0, which is also what the species runs at, so these histories
# are directly usable as build densities.
history_relative_start = 0.0

# Borrowed from the beech fit -- no fir-specific fit was made. The law only
# seeds a solve; every fir density below is measured or simulated.
[pve_calibration.species.silver_fir.law]
slope_per_s = 0.948
floor_per_branch = -1.039
fitted_on = "european_beech r05_h15m"

# Sprays on the sides, tilted 30 deg toward the tip, flat, faces up, one tip
# spray continuing the branch, leader pointing up; no jitter -- a pectinate
# spray is flat. Measured on PVG_FirZV 2026-09-14. Rotations only.
[pve_calibration.species.silver_fir.pose]
reset_phyllotaxy = true
axil_angle = 30.0

# Scale-graded size ladder (XRFF-412, 2026-09-15). Every prototype advertises
# a Scale target (per tree below, `scale_targets`, in ascending prototype-area
# order: f e d c b a g foliage) and the distributor's Scale condition picks the
# tier nearest a point's normalised radius, so the 0.09 m2 spray sits on the
# thickest limbs and the 0.005 m2 sprays on the twigs. The main layer starts at
# generation 2 (no sprays along the trunk); one apex layer (density 1, gen 1)
# puts the largest spray on the leader. Settings measured on the six r08/r16
# trees: the picker min-max normalises the distances across the palette, and
# with six tiers within 0.004 of one another Epic's 0.3 / 2 draws six or seven
# candidates for most samples; 0.1 / 1 picks the two big sprays by radius and
# draws among the near-equal small ones at random.
[pve_calibration.species.silver_fir.ladder]
scale_weight = 1.0
minimum_candidates = 1
cutoff_threshold = 0.1
apex = true
main_generation_start = 2

