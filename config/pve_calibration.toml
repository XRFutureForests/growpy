# ------------------------------------------------------------------ fir ----

[pve_calibration.species.silver_fir]
# Fir stays at 0.0. Four of six trees already have more branches than their
# Forrester target allows, so the one-instance-per-branch floor that a non-zero
# relative_start imposes would put them over target at density 1. Adopting it
# needs a coarser decimation fraction, which means regrowing the trees -- and a
# step-4 re-run grows a different tree.
relative_start = 0.0
fraction = 0.06
phyllotaxy_formation = "OCTASTICHOUS"
prototype_leaf_area_m2 = 0.020138421345048785
prototype_area_per_triangle_m2 = 8.645928697717079e-07
palette_flat_mean_triangles = 23292.375
# The fir bark texture needs its V repeat halved or the bark tiles at the wrong
# aspect. Beech needs no correction, so it carries no bark_y_scale at all.
bark_y_scale = 0.5
forrester_model_id = "forrester2017_conifers_la"
# Measured at 0.0, which is also what the species runs at, so these histories
# are directly usable as build densities.
history_relative_start = 0.0

# Borrowed from the beech fit -- no fir-specific fit was made. The law only
# seeds a solve; every fir density below is measured or simulated.
[pve_calibration.species.silver_fir.law]
slope_per_s = 0.948
floor_per_branch = -1.039
fitted_on = "european_beech r05_h15m"

