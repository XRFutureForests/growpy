# GrowPy Forest Generation Settings
# Used by step 4: generate_forest.py (growpy-generate-forest)
# Quality presets live in quality.toml; Unreal import settings in unreal.toml.

[forest]
# Quality preset name -- must match a [quality.<name>] section in quality.toml
quality = "high"
# Maximum growth cycles per tree (1-250)
# Trees exceeding this limit are capped (not scaled), silently losing their
# upper height stages. Measured uncalibrated cycles-to-max-height: Douglas fir
# 147 (45m), Norway spruce / silver fir 131 (35m), common ash 124 (30m); every
# other dataset species is under 105. 160 clears the tallest with margin.
growth_cycle_limit = 160
# Consecutive no-height-growth cycles (< 1cm gain) before a species' remaining
# active surround-radius grove(s) are declared plateaued and simulation stops
# early, short of growth_cycle_limit above. Height-milestone dataset
# production shares this single counter across whichever radius groves for a
# species are still growing (each radius freezes independently once it
# captures all its own milestones). Below the code default of 10;
# owner-confirmed intentional (2026-08-13, 7eb273b).
#
# 2026-08-22: this knob was NOT the cause of the missing upper stages, and the
# note that used to sit here -- "expect shaded radii to fall short ... that is
# this knob and Grove's competition model working as configured, not a bug" --
# was wrong. Per-cycle height tracing (data/tmp/run25m/seed_probe.py) shows the
# shaded trees do not stall, they LOSE STRUCTURE: at r05, common_ash peaked at
# 23.4 m and ended at 0.6 m, silver_birch 12.3 -> 1.4, norway_spruce 17.1 ->
# 6.5, silver_fir 18.1 -> 5.1, wild_cherry 20.6 -> 4.4, scots_pine 20.5 ->
# 13.6, european_oak 19.6 -> 12.7. Seven of eleven species. Plateau detection
# ratchets on historical maximum height, so a collapsing tree reads as a
# plateaued one and the ladder simply ends -- which is why raising
# plateau_cycles to 15 changed nothing and looked like confirmation.
#
# The cause is Grove's structural collapse at high cycle counts under sustained
# shade, and the remedy is the documented drop_decay_curve/drop_weak_curve
# ease-in ramps now carried in config/preset_patches.json. With them,
# norway_spruce and silver_fir both reach the full h25 ladder at r05.
plateau_cycles = 5
# Number of grove.smooth() passes on branch angles (int, 0-20, 0 = disabled)
# Each pass reduces sharp corner angles between branch segments.
# Higher values = smoother, more organic branches; 10-20 for production.
smooth_iterations = 3
# Include Grove metadata (age, mass, vigor) in USD files
# Increases file size by ~70%; useful for analysis
include_grove_attributes = false
# Multi-stage export: generate tree models at height intervals
# Exports snapshots every N meters of height (e.g., 5 = 5m, 10m, 15m...)
# Snapshots are captured when a tree actually crosses each milestone -- no
# growth model predicts the cycle, so growth speed does not change the stages
# Each snapshot includes height and DBH in the filename for easy asset selection
# 0 = disabled (standard single height-based export)
height_interval = 5
# Cap all tree heights at this value in meters (e.g., 15 for quick testing)
# Trees taller than this in the input CSV are clamped to this height
# Reduces growth cycles and number of height stages for faster runs
# 0 = no limit (use full CSV heights)
# This is a step-4 (export) setting only; step 3's calibration has its own
# independent [growth_models] max_height in growth_models.toml -- keep the two
# in step, so calibration always covers at least the exported range.
# 25 (2026-08-22): the dataset target is the h05/h10/h15/h20/h25 ladder at the
# three surround radii in [surround] radii (r00/r08/r16). Raising this without
# raising the calibration cap would export h20/h25 off the end of the fitted
# curves.
#
# This cap is why a full run produces 165 assemblies (11 species x 5 stages x 3
# radii x 1 density variant), not the 639 of the full per-species ladder: above
# h25 the tall conifers need the height-LOD ladder (XRFF-324) that does not
# exist yet -- at [quality.high] an open-grown silver fir already exhausts a
# 63.5 GB host at h20. See docs/dataset/dataset-overview.md.
max_height = 25

# --- Export options ---
[export]
# Scale exported stem meshes toward the DBH the species' height-DBH allometry
# predicts for the height each tree actually reached. Independent of
# [calibration] in growth_models.toml: the allometry artifact is fitted from
# yield table columns alone (growpy-build-allometry, no Grove simulation), so
# this stays useful with calibration off. Below the fitted height range the
# correction fades out and Grove's own pipe-model diameter is kept.
# Replaces the deprecated calibration.align_dbh / export.radial_scale keys.
dbh_from_allometry = true
# USD file format: "usda" (ASCII, human-readable) or "usdc" (binary, smaller/faster)
# Binary USDC files are ~50% smaller on disk and faster for UE to parse,
# significantly reducing memory pressure during import.
usd_format = "usdc"
# Export target. "unreal" runs the full USD/Nanite/PVE pipeline. "helios"
# writes OBJ directly from the Grove model per tree for Helios++ LiDAR
# simulation, skipping USD/skeleton/PVE/Unreal script generation for that
# tree (see helios.toml for OBJ export settings). Twig prototype meshes still
# come from the small, pre-existing per-species twig USD assets.
mode = "unreal"
# Export skeletal mesh assemblies (required for Unreal animation/wind)
skeletal = true
# Export static mesh assemblies (geometry only, no skeleton)
# When both skeletal and static are enabled, static is derived from skeletal
# Disabled: UE 5.7/5.8 Nanite Assembly builder deadlocks on StaticMesh targets
# (no skeleton) -- see docs/guides/unreal-import.md troubleshooting.
static = false

# Per-tree preview PNGs. dataset_overview.md/.csv are built from `icons`.
icons = true
# Per-view component PNGs alongside the plain/twigs pair: branches-only,
# TWIGS-ONLY, skeleton and merged (io/usd/preview.py generate_icon_image).
# On because the twigs-only view is the only one that shows crown density
# without branch strokes on top of it, which is what the plain _twigs overlay
# cannot separate. Roughly quadruples the icons stage's image count; the icons
# stage is a small fraction of a run, so this is worth it for a dataset that
# gets judged visually.
icon_components = true
# Left OFF deliberately. `previews` re-draws branch architecture, which the
# plain icon already shows, and `export_control` (mesh edges + skeleton joints
# read back from the exported USD) is 15.4% of a full run on its own. Enable
# per-run with --previews / --export-control when inspecting one tree.
previews = false
export_control = false
# Crown density multiplier, relative to Grove's NATURAL twig density.
# 1.0 = exactly what Grove grew. Twigs that build_cutoff_thickness deletes are
# restored from Grove directly (twig recovery), so this no longer has to
# compensate for the cutoff -- it is a purely artistic knob.
# The per-tree CSV twig_density column multiplies with this base.
# Range: 0.0 (no twigs) to 2.0+ (denser than natural; adds synthetic twigs).
#
# Replaces twig_density_conifer / twig_density_broadleaf, which were hand-set
# guesses at the cutoff loss. Measured losses vary more within a growth habit
# than between habits (oak 2.09x vs beech 5.43x; spruce 1.04x vs pine 2.20x)
# and shift with tree age and cutoff, so no per-habit constant could track them.
#
# 0.04, down from 0.5, set 2026-08-06 against published leaf-area allometry
# rather than by eye. Measured on silver fir h15m (d=18cm, r00): at 0.5 the
# crown carried 2,473 m2 of one-sided leaf area against 38.6-146 m2 from
# Forrester et al. 2017 (DOI 10.1016/j.foreco.2017.04.011), i.e. 17-64x too
# much depending on which DBH the equation is fed. Implied needle dry mass at
# 0.5 was 458 kg on a tree whose entire aboveground biomass is 288 kg -- the
# old density was physically impossible, which is what crashed the UE import:
# 22,723 instances x 107,876 faces expands to 2.45 BILLION triangles at import,
# versus 147M at 0.03. See XRFF-272/273/318.
#
# 0.04 is deliberately at the top of the defensible band (crown LAI ~13 against
# a real 4-9), chosen for looks after 0.03 read slightly thin in Blender. The
# honest fix for "correct leaf area but looks sparse" is a SMALLER twig asset,
# not more leaf area: every instance is the same 39x35cm, 0.109 m2 spray at
# scale 1.0 regardless of tree size, so ~1,400 of them cannot help but leave
# gaps in a 90 m2 crown shell.
#
# This is still a single global constant and cannot be right for every tree:
# the over-density factor grew 20x -> 56x -> 64x across the same silver fir's
# h05m/h10m/h15m stages. XRFF-273 replaces this with a per-tree target.
#
# Thinning is random within each twig type, which preserves the spatial
# distribution statistically; overlap is handled separately by
# twig_min_spacing_ratio during recovery.
#
# This global value now applies only to species with no entry in
# [export.twig_density_per_species] below.
twig_density = 0.2
# Per-species values live in [export.twig_density_per_species] at the END of
# this file -- a TOML sub-table captures every key that follows it, so it
# cannot sit here in the middle of [export].
# Distance (m) beyond which a twig orphaned by the cutoff is pulled back onto
# the surviving surface and re-aimed, instead of left where Grove placed it.
# Most orphans sit ~1 mm out; long-shoot species (Scots pine) strand a third of
# theirs 10-100 mm out, which would otherwise read as floating foliage.
twig_reattach_threshold = 0.01
# Restore the twigs build_cutoff_thickness deleted (twig recovery).
# Set false to export Grove's surviving placements untouched -- the reference
# for judging compensation. Note Grove's own seed twig_density is inert in the
# core API (1.0 / 0.25 / 0.0 all grow the same count), so with recovery off the
# only remaining density lever is export twig_density below.
twig_recovery = true
# Reject a recovered twig once it lands closer than this fraction of the
# tree's own median living-twig spacing to an already-placed twig. Branches
# cut close together otherwise stack several compensation twigs on top of
# each other, reading as an unnatural dense tuft. 0 disables the guard.
twig_min_spacing_ratio = 0.75
# Youth bias exponent for synthetic twig placement.
# Controls how strongly additional twigs prefer younger branches.
# 1.0 = linear (default), >1.0 = stronger youth preference, <1.0 = more uniform.
# At 2.0 a branch at youth=0.5 gets 25% weight vs 100% for the youngest.
# Range: 0.0 (uniform placement) to 3.0+ (extreme youth preference)
youth_bias = 1.5
# Maximum skeleton joints for Nanite Assembly USD export.
# Nanite encodes bone indices in 8-bit fields (max 256).
# 0 = no limit (use for PVE native skeletal mesh path which has no constraint).
# 250 = safe default for Nanite Assembly USD import path.
max_skeleton_joints = 1000
# Maximum twig instances per Nanite Assembly.
# During UE import, NaniteAssemblyRootAPI expands all instances into a combined
# Nanite mesh which can consume extreme amounts of RAM.
# 0 = no limit.
# Instances beyond this limit are removed proximity-weighted (crowded twigs go
# first), which thins the crown -- so with twig recovery active this cap, not
# twig_density, becomes the binding constraint on mature trees. A 10 m oak
# reaches ~52k instances at natural density and a 15 m one goes well beyond.
max_assembly_instances = 100000
# Skip assembly validation (saves ~5-10% export time)
skip_validation = true
# Only export specific trees by fid (integer array)
# Other trees still participate in growth simulation (light competition, shading)
# but only the listed trees produce output files
# Useful for studying a single tree growing among neighbors
# Empty array = export all trees
export_trees = []
# Density variants: export multiple density levels from a single simulation.
# Each simulation produces one file per variant without re-simulating.
# Empty list (default) = single export using CSV/config twig_density.
# When active, CSV twig_density column is ignored.
# Variant definitions are in quality.toml under [density_variant.*].
density_variants = [] # e.g., ["full", "reduced", "bare"]


# Per-species crown density, keyed on standardized name. Overrides
# [export] twig_density above for the species listed.
#
# MUST STAY LAST in this file: a TOML sub-table captures every key that
# follows it, so any [export] key placed after this would silently land
# inside this table instead.
#
# Back-solved 2026-08-06 from a measured dataset run: every species was
# exported at a uniform 0.04, its actual one-sided leaf area computed as
# sum(instances_i x prototype_leaf_area_i) from the per-twig sidecars, and
# compared against Forrester et al. 2017 (DOI 10.1016/j.foreco.2017.04.011).
# value = 0.04 / measured_ratio, using the mean over the three surround radii
# at h15m.
#
# The spread is 103x (silver_fir 0.0078 to common_ash 0.80), so a single global
# constant cannot serve the dataset. It is driven mostly by how much leaf area
# each species' twig prototype carries -- the shared fir spray is 0.109 m2
# against 0.023 m2 for ash -- NOT by Grove's placement. Note common_ash lands
# near Grove's natural density: its crown was never over-dense, and the
# "crowns are 20-70x too dense" finding was specific to the three species
# sharing the large fir spray.
#
# Calibrated on h15m deliberately. Required density also varies within a
# species across height stages (conifers need ~3x more at h05m than at h15m),
# and h15m is both the heaviest asset and the one that blows UE's memory
# budget, so it is the safe stage to pin. Consequence: h05m/h10m conifers come
# out sparser than target. Fixing that properly needs the per-tree resolver
# (XRFF-273).
#
# Re-derive after any change to twig assets, quality preset, or growth
# calibration -- all three move the measured ratio.
[export.twig_density_per_species]
# Every value below was back-solved 2026-09-04 by `growpy-calibrate-crown-
# density`, which is this table's own documented method made repeatable: export
# at the configured density, measure each crown's ONE-SIDED leaf area as
# sum(instances_i x prototype_leaf_area_i) off the exported PointInstancer, and
# divide by the ratio to the published target. Re-run that tool after any change
# to twig assets, quality preset or growth calibration, and re-export FIRST --
# it reads areas off disk and densities out of this file, so a stale export
# quietly yields a wrong suggestion.
#
# Two things changed under this round, and both moved every species.
#
# Targets are now per TREE. Forrester et al. (2017) leaf-area equations live in
# pylometree (model_type "leaf_area") and are evaluated at each tree's own
# diameter, instead of comparing a mean over three radii against one 38.6 m2
# figure -- that figure being the pooled-conifer fit at d=18 cm, while these
# h15m trees run d=14-30 cm. Eight species get a species-specific fit; Abies
# alba, Acer pseudoplatanus and Tilia cordata have none and use the pooled one.
# Betula pendula and Prunus avium have one but it was fitted over d 1-14 and
# 1-10 cm, so mature trees fall back to the pooled broadleaved fit rather than
# extrapolate a power law past its data.
#
# Leaf area is now measured leaf-only. The `<prototype>_leaf_area.json` sidecars
# tag leaves by MATERIAL, so on any asset shipping one material the woody shoot
# counted as leaf -- 8.7% of apparent leaf area across the converted library,
# 35% on the worst fir variant. `convert-twigs` now also writes the topological
# `_leaf_area_geom.json` split, and every species below reads it.
#
# Measured on a clean full run: 11 species, 32 h15m trees, all on the geom basis.
common_ash = 1.0307          # measured 0.78x at 0.800
douglas_fir = 0.0959         # measured 0.42x at 0.0399
european_beech = 0.2231      # measured 0.62x at 0.138
european_oak = 0.1764        # measured 0.84x at 0.148
norway_spruce = 0.0556       # measured 0.55x at 0.0305
scots_pine = 0.0343          # measured 0.53x at 0.0181
silver_birch = 0.1276        # measured 1.57x at 0.200 -- pooled fit
silver_fir = 0.0428          # measured 0.71x at 0.0304 -- pooled fit
small_leaved_linden = 0.3119 # measured 0.45x at 0.139 -- pooled fit
sycamore_maple = 0.0535      # measured 2.13x at 0.114 -- pooled fit
wild_cherry = 0.0320         # measured 1.04x at 0.0331 -- pooled fit
