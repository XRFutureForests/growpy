# GrowPy Forest Generation Settings
# Used by step 4: generate_forest.py (growpy-generate-forest)
# Quality presets live in quality.toml; Unreal import settings in unreal.toml.

[forest]
# Quality preset name -- must match a [quality.<name>] section in quality.toml
quality = "medium"
# Maximum growth cycles per tree (1-250)
# Trees exceeding this limit are capped (not scaled), silently losing their
# upper height stages. Measured uncalibrated cycles-to-max-height: Douglas fir
# 147 (45m), Norway spruce / silver fir 131 (35m), common ash 124 (30m); every
# other dataset species is under 105. 160 clears the tallest with margin.
growth_cycle_limit = 160
# Consecutive no-height-growth cycles (< 1cm gain) before a species' remaining
# active surround-radius grove(s) are declared plateaued and simulation stops
# early, short of growth_cycle_limit above. Height-milestone dataset
# production shares this single counter across whichever radius groves for a
# species are still growing (each radius freezes independently once it
# captures all its own milestones) -- a heavily-shaded grove (e.g. r08/r16)
# can hit a genuine temporary lull under Grove's own shading/pruning dynamics
# well before growth_cycle_limit, silently truncating its upper height
# stages. Raised from the code default of 10: observed real stalls of
# 7-9 consecutive cycles for some species/radius combos reaching 15-20m.
plateau_cycles = 25
# Number of grove.smooth() passes on branch angles (int, 0-20, 0 = disabled)
# Each pass reduces sharp corner angles between branch segments.
# Higher values = smoother, more organic branches; 10-20 for production.
smooth_iterations = 3
# Include Grove metadata (age, mass, vigor) in USD files
# Increases file size by ~70%; useful for analysis
include_grove_attributes = false
# Multi-stage export: generate tree models at height intervals
# Exports snapshots every N meters of height (e.g., 5 = 5m, 10m, 15m...)
# Snapshots are captured when a tree actually crosses each milestone -- no
# growth model predicts the cycle, so growth speed does not change the stages
# Each snapshot includes height and DBH in the filename for easy asset selection
# 0 = disabled (standard single height-based export)
height_interval = 5
# Cap all tree heights at this value in meters (e.g., 15 for quick testing)
# Trees taller than this in the input CSV are clamped to this height
# Reduces growth cycles and number of height stages for faster runs
# 0 = no limit (use full CSV heights)
# This is a step-4 (export) setting only; step 3's calibration has its own
# independent [growth_models] max_height in growth_models.toml.
max_height = 15

# --- Export options ---
[export]
# Scale exported stem meshes toward the DBH the species' height-DBH allometry
# predicts for the height each tree actually reached. Independent of
# [calibration] in growth_models.toml: the allometry artifact is fitted from
# yield table columns alone (growpy-build-allometry, no Grove simulation), so
# this stays useful with calibration off. Below the fitted height range the
# correction fades out and Grove's own pipe-model diameter is kept.
# Replaces the deprecated calibration.align_dbh / export.radial_scale keys.
dbh_from_allometry = true
# USD file format: "usda" (ASCII, human-readable) or "usdc" (binary, smaller/faster)
# Binary USDC files are ~50% smaller on disk and faster for UE to parse,
# significantly reducing memory pressure during import.
usd_format = "usdc"
# Export target. "unreal" runs the full USD/Nanite/PVE pipeline. "helios"
# writes OBJ directly from the Grove model per tree for Helios++ LiDAR
# simulation, skipping USD/skeleton/PVE/Unreal script generation for that
# tree (see helios.toml for OBJ export settings). Twig prototype meshes still
# come from the small, pre-existing per-species twig USD assets.
mode = "unreal"
# Export skeletal mesh assemblies (required for Unreal animation/wind)
skeletal = true
# Export static mesh assemblies (geometry only, no skeleton)
# When both skeletal and static are enabled, static is derived from skeletal
# Disabled: UE 5.7/5.8 Nanite Assembly builder deadlocks on StaticMesh targets
# (no skeleton) -- see docs/guides/unreal-import.md troubleshooting.
static = false
# Crown density multiplier, relative to Grove's NATURAL twig density.
# 1.0 = exactly what Grove grew. Twigs that build_cutoff_thickness deletes are
# restored from Grove directly (twig recovery), so this no longer has to
# compensate for the cutoff -- it is a purely artistic knob.
# The per-tree CSV twig_density column multiplies with this base.
# Range: 0.0 (no twigs) to 2.0+ (denser than natural; adds synthetic twigs).
#
# Replaces twig_density_conifer / twig_density_broadleaf, which were hand-set
# guesses at the cutoff loss. Measured losses vary more within a growth habit
# than between habits (oak 2.09x vs beech 5.43x; spruce 1.04x vs pine 2.20x)
# and shift with tree age and cutoff, so no per-habit constant could track them.
twig_density = 1.0
# Distance (m) beyond which a twig orphaned by the cutoff is pulled back onto
# the surviving surface and re-aimed, instead of left where Grove placed it.
# Most orphans sit ~1 mm out; long-shoot species (Scots pine) strand a third of
# theirs 10-100 mm out, which would otherwise read as floating foliage.
twig_reattach_threshold = 0.01
# Youth bias exponent for synthetic twig placement.
# Controls how strongly additional twigs prefer younger branches.
# 1.0 = linear (default), >1.0 = stronger youth preference, <1.0 = more uniform.
# At 2.0 a branch at youth=0.5 gets 25% weight vs 100% for the youngest.
# Range: 0.0 (uniform placement) to 3.0+ (extreme youth preference)
youth_bias = 2.0
# Maximum skeleton joints for Nanite Assembly USD export.
# Nanite encodes bone indices in 8-bit fields (max 256).
# 0 = no limit (use for PVE native skeletal mesh path which has no constraint).
# 250 = safe default for Nanite Assembly USD import path.
max_skeleton_joints = 8192
# Maximum twig instances per Nanite Assembly.
# During UE import, NaniteAssemblyRootAPI expands all instances into a combined
# Nanite mesh which can consume extreme amounts of RAM.
# 0 = no limit.
# Instances beyond this limit are removed proximity-weighted (crowded twigs go
# first), which thins the crown -- so with twig recovery active this cap, not
# twig_density, becomes the binding constraint on mature trees. A 10 m oak
# reaches ~52k instances at natural density and a 15 m one goes well beyond.
max_assembly_instances = 100000
# Skip assembly validation (saves ~5-10% export time)
skip_validation = true
# Only export specific trees by fid (integer array)
# Other trees still participate in growth simulation (light competition, shading)
# but only the listed trees produce output files
# Useful for studying a single tree growing among neighbors
# Empty array = export all trees
export_trees = []
# Density variants: export multiple density levels from a single simulation.
# Each simulation produces one file per variant without re-simulating.
# Empty list (default) = single export using CSV/config twig_density.
# When active, CSV twig_density column is ignored.
# Variant definitions are in quality.toml under [density_variant.*].
density_variants = [] # e.g., ["full", "reduced", "bare"]
