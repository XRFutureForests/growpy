# Compare-board sets for growpy-ue-compare (cleanup class E step 2, owner 2026-11-19).
#
# One set = one compare level: one row per source, trees 10 m apart. A row is
#   { label = "...", <one source>, tag = "...", optional = true }
# with exactly one source:
#   assets   = ["/Game/...", ...]                    content paths, in order
#   pattern  = "/Game/.../SK_X_{cell}", cells = [...] one asset per cell
#   variants = "/scots_pine/"                         the mesh column of the --variants file
#                                                     (twig-tune variants.txt), filtered
# tag: the actor-label prefix, default the label's first word (a /TwigTune/<arm>/ asset
# takes its arm). optional: the row is dropped in the editor when none of its assets exist.
# A label may name {params} given as --param key=value.
# Set keys: rows, description, contexts (default ["light"]), neighbours (forest context;
# default forest_neighbours below), assembly_tris (E111 T3D triangle yardstick).
# Ported from build_compare_conifers.py (2026-11-13..19); "catalog" is its default rows.

[compare]
level = "/Game/Developers/Max/LiveCheck/L_Compare_Conifers"

# forest context (E124, fleck check 2026-11-19): catalog neighbours behind each tree, away
# from the camera at -X; dx, dy in cm
forest_neighbours = [
    { asset = "/Game/Generated/Trees/Catalog/douglas_fir/SK_DouglasFir_r10_h25m", dx = 1200.0, dy = -450.0 },
    { asset = "/Game/Generated/Trees/Catalog/norway_spruce/SK_NorwaySpruce_r07_h20m", dx = 1500.0, dy = 500.0 },
    { asset = "/Game/Generated/Trees/Catalog/douglas_fir/SK_DouglasFir_r07_h30m", dx = 2000.0, dy = 0.0 },
    { asset = "/Game/Generated/Trees/Catalog/european_beech/SK_EuropeanBeech_r07_h20m", dx = 1700.0, dy = -1100.0 },
]

