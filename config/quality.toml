# GrowPy Quality Presets and Density Variants
#
# Quality presets are selected by [forest] quality in config/forest.toml.
# Any omitted key falls back to the built-in default in quality.py.
#
# NOTE (XRFF-404): a preset name sets TWO independent things, and they are worth
# telling apart when tuning. See digital-twin-db/docs/level-of-detail-vocabulary.md.
#
#   render resolution  - how finely existing geometry is tessellated:
#                        resolution, resolution_reduce
#   structural detail  - which parts of the tree exist at all:
#                        build_cutoff_age, build_cutoff_thickness, skeleton_*
#
# A structurally complete tree at low tessellation is a reasonable ask that a
# single preset name cannot express. Neither is "LoD": that word is reserved for
# the CityGML representation ladder (LoD0-4) stored in the database.

# Mesh Parameters (Grove defaults from Properties.py / build_models API):
#   resolution            - Cross-section vertex count at trunk base (int, 8-32,
#                           Grove default 16)
#   resolution_reduce     - How fast vertex count drops on thinner branches (0.0-1.0,
#                           0.0 = uniform, 1.0 = very fast reduction,
#                           Grove default 0.78)
#   build_cutoff_age      - Skip branches younger than N growth cycles (Grove default 0)
#   build_cutoff_thickness - Min branch diameter in meters to include (Grove default 0.0,
#                           e.g. 0.005 = skip branches thinner than 5 mm)
#                           CAUTION: raising this to cut mesh triangle count (e.g. for
#                           conifer species with dense fine branching) removes the
#                           youngest branches first -- exactly where Grove places most
#                           twigs. Grove does not compensate foliage placement for
#                           dropped branches, so the crown reads as too sparse. This
#                           also removes the branch attachment points a custom
#                           foliage-density method would otherwise pack twigs onto, so
#                           even repacking remaining young branches at max density
#                           cannot fill a crown that lost branches outright. Prefer
#                           other levers (voxelization, resolution) for perf work.
#   build_blend           - Extra geometry for smooth branch junctions (Grove default true)
#   build_end_cap         - Close off open branch ends with geometry (Grove default true)
#
# Skeleton Parameters (control bone count -- Unreal 16-bit limit = 32,767 bones):
#   skeleton_length     - Min bone length in meters (0.0-5.0, Grove default 2.0 m).
#                         Nodes are skipped until a bone reaches this length.
#                         Lower = more bones (finer), higher = fewer bones (coarser).
#   skeleton_reduce     - Branch thickness threshold, unitless (0.0-1.0, Grove default 0.4).
#                         Thin side branches below this threshold get no bones.
#                         Squared internally before passing to Grove API.
#   skeleton_bias       - Bone density distribution (0.0-1.0, Grove default 0.5).
#                         0.0 = more bones on trunk/base, 1.0 = more bones at tips.
#   skeleton_connected  - Connected bone chains vs floating bones.
#                         true = required for Unreal skeletal mesh animation.

[quality.ultra]
resolution = 24
resolution_reduce = 0.25
build_cutoff_age = 0
build_cutoff_thickness = 0.0
build_blend = true
build_end_cap = true
skeleton_length = 0.5
skeleton_reduce = 0.25
skeleton_bias = 0.5
skeleton_connected = true

[quality.high]
resolution = 16
resolution_reduce = 0.5
build_cutoff_age = 0
build_cutoff_thickness = 0.0025
build_blend = true
build_end_cap = true
skeleton_length = 1.0
skeleton_reduce = 0.333
skeleton_bias = 0.5
skeleton_connected = true

[quality.medium]
resolution = 12
resolution_reduce = 0.75
build_cutoff_age = 0
build_cutoff_thickness = 0.0025
build_blend = true
build_end_cap = true
skeleton_length = 1.5
skeleton_reduce = 0.5
skeleton_bias = 0.5
skeleton_connected = true

# Mesh-aggressive preset for species whose stem meshes are too large for the
# UE Nanite/skinned-mesh build to handle. Measured on 2026-08-31: a stem mesh
# of ~12.9M triangles drives the UE importer to 56.7 GB of 57.1 GB available
# and takes 3h51m for one tree, while ~7.9M imports in 24 min. At [quality.high]
# the tallest beech/spruce/silver-fir stems reach ~63M triangles (~24.5M even at
# [quality.medium]), so those species need this preset to import at all.
#
# Skeleton values deliberately match [quality.high]: bone count does not drive
# the import cost -- stem triangle count does -- and cutting bones only degrades
# DynamicWind. Reducing mesh resolution without touching the skeleton keeps wind
# animation fidelity intact.
[quality.low]
resolution = 8
resolution_reduce = 0.9
build_cutoff_age = 0
# Measured 2026-09-01 on silver_fir h25 (baseline 0.0025 = 24.6M tris, 272,996
# twigs surviving, which is ~2,900 instances after twig_density_per_species):
#   0.01  -> 0.37M tris but ZERO twigs. A 10 mm cutoff strips every
#            foliage-bearing branch, and twig recovery cannot restore foliage
#            once the attachment points are gone. Do not use.
#   0.004 -> 8.86M tris (2.8x down, inside the importable band) while the final
#            assembly still carries 2,612 twig instances vs 2,959 for the
#            near-identical norway_spruce at 0.0025 -- only ~12% sparser.
# The pool shrinks 8.7x but the crown barely moves, because the per-species
# twig density (silver_fir 0.0078) already discards >99% of surviving twigs and
# placement is bounded by min-spacing, not by pool size. That is what makes
# 0.004 safe here and 0.01 not. Always measure twig survival AND final instance
# count before changing this.
build_cutoff_thickness = 0.004
build_blend = true
build_end_cap = true
skeleton_length = 1.0
skeleton_reduce = 0.333
skeleton_bias = 0.5
skeleton_connected = true

# Broadleaf counterpart to [quality.low]. Same mesh resolution, gentler cutoff.
#
# [quality.low]'s 0.004 cutoff suits conifers because their per-species twig
# density discards >99% of the pool, so shrinking the pool barely touches the
# crown (silver_fir -12%, norway_spruce actually +19%). Broadleaves discard far
# less -- european_beech = 0.138 keeps ~14% -- so the same cutoff propagates
# straight through: measured 2026-09-01, beech h25 at 0.004 fell to 28,439 twig
# instances from 52,320 natural, while its stem mesh overshot to 3.96M triangles
# when anything up to ~8M imports fine. 0.003 spends that headroom on crown
# instead. Use this preset for broadleaf species that need stem reduction.
[quality.performance]
resolution = 8
resolution_reduce = 0.9
build_cutoff_age = 0
build_cutoff_thickness = 0.003
build_blend = true
build_end_cap = true
skeleton_length = 1.0
skeleton_reduce = 0.333
skeleton_bias = 0.5
skeleton_connected = true

[quality.helios]
resolution = 9
resolution_reduce = 0.75
build_cutoff_age = 0
build_cutoff_thickness = 0
build_blend = false
build_end_cap = false
skeleton_length = 2.0
skeleton_reduce = 0.8
skeleton_bias = 0.5
skeleton_connected = true

[quality.debug]
resolution = 8
resolution_reduce = 0.5
build_cutoff_age = 0
build_cutoff_thickness = 0.005
build_blend = true
build_end_cap = true
skeleton_length = 2.0
skeleton_reduce = 0.5
skeleton_bias = 0.5
skeleton_connected = true

# --- Density Variant Definitions ---
# Each variant can override build_cutoff and twig_density from the quality preset.
# Only keys listed here override; others inherited from active [quality.*] preset.
# Referenced by name in export.density_variants list in config/forest.toml.

# twig_density is relative to Grove's NATURAL density (1.0 = as grown), since
# twig recovery restores whatever build_cutoff_thickness deleted. That makes the
# number mean the same thing on every species and at every age.
#
# build_cutoff_thickness is deliberately NOT overridden here any more: with
# recovery active it no longer thins the crown, so it is purely a mesh
# triangle-budget lever. Keeping it here would change the trunk/branch LOD
# between variants while leaving the foliage identical -- the opposite of what
# these variants are for. Set it in the [quality.*] preset instead.

[density_variant.full]
twig_density = 1.0

[density_variant.reduced]
twig_density = 0.6

[density_variant.bare]
twig_density = 0.25

# Tall-stage preset for dataset production. Selected per stage via
# [forest] quality_above_height in forest.toml, not by [forest] quality.
#
# Measured on an open-grown silver fir at h20 (273,421 branches), which is the
# heaviest thing the dataset builds:
#
#   res reduce  cutoff      points       faces         uvs
#    16   0.50  0.0025  12,371,707  11,589,558  43,916,482   <- [quality.high]
#    12   0.75  0.0025   5,288,077   4,505,928  16,949,056   <- [quality.medium]
#    12   0.75  0.0050     489,898     341,390   1,264,282   <- here
#    12   0.75  0.0120      95,496      62,502     230,497
#
# build_cutoff_thickness is the lever that matters, and it behaves as a cliff
# rather than a slope: 0.0025 -> 0.005 removes 10.8x the points, because a
# mature conifer's branch count is dominated by sub-5mm twiglets. Resolution
# alone only buys 2.3x, which is why the stock "medium" preset was not enough
# to make h20/h25 exportable (it reached 47 GB and still ran out of memory).
#
# The usual objection to raising build_cutoff_thickness -- that it deletes the
# young branches where Grove places twigs -- DOES bite, and the cost lands on
# twig recovery rather than on the crown. Measured on the same h20 tree, out of
# 131,764 living twig placements in the cutoff-free reference build:
#
#   cutoff   mesh points   twigs surviving   orphans to reattach
#   0.0025     5,288,077           125,519                 6,245   (95.3%)
#   0.0035     5,288,077           125,519                 6,245   (95.3%)  <- identical
#   0.0040     1,938,038            17,437               114,327   (13.2%)
#   0.0050       489,898               107               131,657   ( 0.1%)
#
# Recovery restores the orphans exactly (positions, directions, phyllotactic
# quaternions), so the crown is NOT sparse -- but reattaching 131k of them is
# itself expensive, and at h25 that is what the export runs out of memory on.
# Note also that the cutoff is quantised: 0.0025, 0.003 and 0.0035 produce a
# bit-identical mesh, so there is no gradual trade to tune between them. The
# cliff is at 0.004.
#
# 0.005 is chosen deliberately: it is the only value that makes the h20/h25
# MESH affordable (490k points against 12.4M at [quality.high]), and the mesh
# is the larger of the two costs -- at 0.0025 the export runs out of memory at
# h20, before it can reach h25 at all.
#
# Applied only to h20/h25 at r00 in production: those are the biggest trees in
# the matrix (507,554 branches at h25 against 359,562 for r05), a 5mm branch on
# a 25m tree is well below what Nanite resolves in VR, and h05-h15 plus every
# shaded radius stay on [quality.high].
[quality.dataset_tall]
resolution = 12
resolution_reduce = 0.75
build_cutoff_age = 0
build_cutoff_thickness = 0.005
build_blend = true
build_end_cap = true
skeleton_length = 1.0
skeleton_reduce = 0.333
skeleton_bias = 0.5
skeleton_connected = true
