# GrowPy Unreal Engine Import Settings
#
# Controls UE Python import script generation, Nanite build settings,
# and PVE (Procedural Vegetation Editor) preset import.

[unreal]
# Generate Unreal Python import script (unreal_import_trees.py / unreal_cleanup_trees.py)
import_to_unreal = true
# Unreal content path for imported assets in Content Browser
project_path = "/Game/Assets/TheGrove"
# Path to the ST_TreeCatalogEntry struct (and where DT_TreeCatalog gets
# created). Lives under /Content/Templates in the project, not under
# project_path -- the old /Game/Assets/TheGrove location is no longer used.
db_path = "/Game/Templates"
# Content Browser base the wind and PVE post-import scripts search for
# assemblies. Leave unset (or empty) so it follows project_path -- assemblies
# import to project_path, so wind data and PVE presets have to look for them
# there. Setting it to something else deliberately splits the two, which is
# almost never what you want: the assemblies still import fine and then silently
# fail every wind/PVE check, because the post-import scripts are searching a
# path that has no assemblies in it.
# pve_import_base = ""
# Automatically set Nanite shape preservation to Voxelize on imported assemblies.
# Voxelization produces the best visual quality but adds significant import time.
# Set to false for faster testing iterations; re-enable for production exports.
voxelization = true
# Nanite fallback mesh triangle percentage (0.0-1.0).
# The fallback mesh is used when Nanite is unavailable: complex collision
# queries, ray tracing without Nanite RT, mobile, editor "Nanite off" view.
# Lower values reduce build time and VRAM at no visual cost when Nanite renders.
# 0.01 = keep 1% of triangles (recommended), 1.0 = keep all (wasteful).
nanite_fallback_percent = 0.01
# Nanite fallback heuristic: "percent_triangles", "relative_error", "auto".
# CRITICAL: if left at engine default (often "auto"/"relative_error"), the
# fallback_percent value above may be silently ignored, leaving fallbacks
# much heavier than intended. Setting this explicitly is the single biggest
# import-perf win for forests where Nanite is always available.
nanite_fallback_target = "percent_triangles"
# Interpolate UVs during Nanite mesh simplification.
# Should be true for textured meshes to avoid UV seam artifacts at distance.
nanite_lerp_uvs = true

# --- PVE preset import (UE 5.7 only) --- DEPRECATED, DEAD ON UE 5.8 ---
# Generated a complementary UE Python script that creates
# ProceduralVegetationPreset DataAssets from per-tree PVE JSON recipes
# (*_stems_unreal_pve.json), alongside the skeletal-mesh assembly import.
#
# DO NOT TURN THIS ON for UE 5.8+. The node those presets feed is declared
#
#   UCLASS(meta=(DeprecatedNode, DeprecationMessage="PVPresetLoaderSettings is
#          deprecated and produces no output. Remove this node from your graph."))
#
# so everything downstream of it -- the recipe JSON, the preset DataAssets, the
# graphs wired to them -- is built and then does nothing. `pve_graph_script.py`
# already carries a `_is_ue_58_plus()` guard for exactly this.
#
# This is NOT the setting for the current PVE route. That is
# [unreal.growth_data_json] below, which drives a different artifact entirely:
# a SKELETON for PVGrowthDataJsonImporter, not a preset RECIPE for a dead node.
# The two share an acronym and nothing else, which is why the old flag was left
# in place and deprecated rather than quietly repurposed -- an existing config
# saying `generate_pve_presets = true` must not silently start emitting a
# different file.
generate_pve_presets = false
# Generate the UE wind-import script that applies *_DynamicWind.json sidecars
# to skeletal meshes (per-tree wind JSON is always exported regardless).
generate_wind_data = true

# --- ue_exec auto-restart watchdog (tools/ue_exec.py) ---
# Separate from the import-script generation above: read only by the
# standalone ue_exec.py watchdog tool, not by generate_forest.py.
# Machine-specific absolute paths -- not committed with real values since this
# config file ships in a public repo. Set these to use the watchdog without
# passing --editor-exe/--uproject on every invocation. --editor-exe/--uproject
# always take priority when given.
[unreal.watchdog]
# editor_exe = "C:\\Program Files\\Epic Games\\UE_5.8\\Engine\\Binaries\\Win64\\UnrealEditor.exe"
# uproject = "D:\\Unreal\\XRLabDB 5.8\\XRLabDB.uproject"

# ---------------------------------------------------------------------------
# Growth-data JSON export for PVE's Growth Data JSON Importer (XRFF-390 route).
#
# This is the skeleton-direct route: growpy emits a growth-data JSON and PVE
# builds the trunk mesh itself, instead of growpy authoring a Nanite assembly.
# Off by default -- it is an experiment running alongside the USD route, and
# turning it on adds a per-tree JSON to every step-4 export.
#
# profile_mean: mean radial multiplier of the PVE trunk profile the tree will be
#   meshed with. A PVE profile is 100 multipliers that always peak at 1.0 and
#   carve inward, so PointScale becomes the section's MAXIMUM radius and a
#   tape-measured DBH reads mean(profile) times what was asked for. Emitted
#   radii are divided by this so DBH survives. Measured 2026-09-09 on two
#   independent skeletons: 0.775 and 0.784-0.793 against plantProfile_2's own
#   0.7795. Epic's ten profiles run 0.599-0.822 -- a 37 % swing, so this is not
#   optional. plantProfile_8 (0.8215) is the chosen default: roundest section
#   with the mildest relief.
#
#   THIS NUMBER IS HALF A CONTRACT. The other half is which pin of
#   PVPlantProfileLoader the graph wires into MeshBuilder.Profile, and nothing
#   checks that the two agree. Measured 2026-09-10: the test graph was on
#   plantProfile_7 (0.7694) while this said 0.8215, so every exported trunk came
#   out 6.3 % thin and still looked entirely plausible. If you change this value,
#   change the pin; if you author a graph, assert the pin name.
#
# min_branch_radius_fraction: drop branches whose thickest point is below this
#   fraction of the TRUNK'S BASE RADIUS, with their subtrees. Relative, not
#   absolute, because an absolute cutoff is applied in emitted units and so does
#   not survive radial_scale: 0.030 m is 16 % of an uncalibrated trunk but 45 %
#   of a calibrated one, and on a calibrated h15m beech it left 62 branches over
#   2 GENERATIONS where Epic's reference tree has 6 -- the whole crown hierarchy
#   gone. Measured across 9 beeches (3 surround radii x 3 height stages), 0.06
#   holds 5-6 generations on every one, at 321-1,978 branches. growpy's branch
#   COUNTS are not comparable to Epic's -- Grove splits branches much more finely
#   (~10 points per branch against Beech_01's 26.4) -- so generations preserved
#   is the meaningful measure.
#
# min_branch_radius: absolute metre cutoff, kept for the rare case where one is
#   genuinely wanted. Whichever of the two is larger wins. Leave at 0.0.
#
# (superseded note) drop branches whose thickest point is below this (metres),
#   with their subtrees. Grove's raw skeleton is ~46,500 branches / 275,800
#   points for a beech, against Epic's reference tree at 195 / 5,145. Point
#   SPACING is already fine (0.067 m vs 0.072 m) -- it is branch COUNT that is
#   wrong, and it also breaks foliage, since BranchDensity is per branch and
#   46,500 branches against a ~13,400-instance target needs a density below 1.
#   0.030 m keeps 649 branches at 27.3 points each, the closest structural match
#   to the reference. NOTE: the threshold is in EMITTED units, so it interacts
#   with the per-tree radial_scale -- 0.030 keeps 649 branches at scale 1.0 but
#   only 95 at scale 0.5.
[unreal.growth_data_json]
enabled = true
profile_mean = 0.8215
min_branch_radius = 0.0
min_branch_radius_fraction = 0.06
