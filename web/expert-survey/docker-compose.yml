# The expert tree survey as its own stack. Local: `docker compose up -d --build`, then
# http://localhost:8080/ (answers land in ./answers). dt.unr adds docker-compose.dtunr.yml.
services:
  survey:
    build: .
    image: xrff-survey:latest
    container_name: xrff-survey
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${SURVEY_DATA:-./answers}:/data
